<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>MON_AGENCE | Web Agency</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- ============================================================
       SITE CONFIG — Modifiez uniquement ce bloc
       ============================================================ -->
  <script id="SITE_CONFIG">
    const SITE_CONFIG = {
      // Identité — remplacez ces valeurs
      agencyName: "MON_AGENCE",
      logoSvg: null,  // Collez votre SVG ici en string, ex: '<svg>...</svg>'
      tagline: "Votre business en ligne en quelques jours, pas en mois.",

      // Pricing
      pricing: {
        starter:    { price: "400€",       sub: "+ maintenance mensuelle" },
        business:   { price: "1250€",      sub: "Paiement unique" },
        premium:    { price: "2500€",      sub: "Paiement unique" },
        enterprise: { price: "SUR DEVIS",  sub: "Architecture Custom" },
      },

      // Liens — remplacez avant mise en ligne
      calendlyUrl: "https://calendly.com/TON_LIEN",
      notifEmail:  "ton@email.com",

      // Réseaux
      socialLinks: { instagram: "#", linkedin: "#" },
      copyrightYear: "2025",
    };
  </script>
  <!-- ============================================================ -->

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary":                    "#ffffff",
            "on-primary":                 "#283500",
            "primary-fixed":              "#c3f400",
            "primary-fixed-dim":          "#abd600",
            "on-primary-fixed":           "#161e00",
            "primary-container":          "#c3f400",
            "on-primary-container":       "#556d00",
            "secondary":                  "#c6c6c7",
            "on-secondary":               "#2f3131",
            "secondary-container":        "#454747",
            "on-secondary-container":     "#b4b5b5",
            "tertiary":                   "#ffffff",
            "background":                 "#131313",
            "on-background":              "#e5e2e1",
            "surface":                    "#131313",
            "surface-dim":                "#131313",
            "surface-bright":             "#3a3939",
            "surface-container-lowest":   "#0e0e0e",
            "surface-container-low":      "#1c1b1b",
            "surface-container":          "#201f1f",
            "surface-container-high":     "#2a2a2a",
            "surface-container-highest":  "#353534",
            "surface-tint":               "#abd600",
            "on-surface":                 "#e5e2e1",
            "on-surface-variant":         "#c4c9ac",
            "outline":                    "#8e9379",
            "outline-variant":            "#444933",
            "inverse-surface":            "#e5e2e1",
            "inverse-on-surface":         "#313030",
            "inverse-primary":            "#506600",
            "error":                      "#ffb4ab",
            "error-container":            "#93000a",
          },
          borderRadius: {
            DEFAULT: "0px", none: "0px", sm: "0px",
            md: "0px", lg: "0px", xl: "0px",
            "2xl": "0px", "3xl": "0px", full: "0px",
          },
          fontFamily: {
            headline: ["Space Grotesk", "sans-serif"],
            body:     ["Inter", "sans-serif"],
            label:    ["Inter", "sans-serif"],
          },
        },
      },
    };
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    html { scroll-behavior: smooth; }
    .sim-step { display: none; }
    .sim-step.active { display: grid; }
    .sim-card.selected {
      border-color: #c3f400;
      background-color: #353534;
    }
    .nav-link {
      color: white;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.05em;
      padding: 0.5rem 0.75rem;
      transition: all 75ms;
    }
    .nav-link:hover {
      background-color: #c3f400;
      color: #283500;
      transform: translate(-4px, -4px);
      box-shadow: 4px 4px 0px 0px #FFFFFF;
    }
    .mobile-nav-link {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.25rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.05em;
      color: #ffffff;
      transition: color 150ms;
    }
    .mobile-nav-link:hover { color: #c3f400; }
  </style>
</head>
<body class="bg-background text-on-background font-body antialiased min-h-screen selection:bg-primary-fixed selection:text-on-primary">

  <!-- NAV -->
  <!-- MAIN -->
  <!-- FOOTER -->

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Title
      document.title = SITE_CONFIG.agencyName + ' | Web Agency';

      // agencyName text nodes
      document.querySelectorAll('[data-config="agencyName"]').forEach(el => {
        el.textContent = SITE_CONFIG.agencyName;
      });

      // Logo: SVG or text fallback
      document.querySelectorAll('[data-config-logo]').forEach(el => {
        if (SITE_CONFIG.logoSvg) {
          el.innerHTML = SITE_CONFIG.logoSvg;
        } else {
          el.textContent = SITE_CONFIG.agencyName;
        }
      });

      // Tagline
      document.querySelectorAll('[data-config="tagline"]').forEach(el => {
        el.textContent = SITE_CONFIG.tagline;
      });

      // Pricing
      Object.entries(SITE_CONFIG.pricing).forEach(([tier, data]) => {
        document.querySelectorAll(`[data-price="${tier}"]`).forEach(el => {
          el.textContent = data.price;
        });
        document.querySelectorAll(`[data-price-sub="${tier}"]`).forEach(el => {
          el.textContent = data.sub;
        });
      });

      // Calendly links
      document.querySelectorAll('[data-config="calendlyUrl"]').forEach(el => {
        el.href = SITE_CONFIG.calendlyUrl;
      });

      // Social links
      document.querySelectorAll('[data-social="instagram"]').forEach(el => {
        el.href = SITE_CONFIG.socialLinks.instagram;
      });
      document.querySelectorAll('[data-social="linkedin"]').forEach(el => {
        el.href = SITE_CONFIG.socialLinks.linkedin;
      });

      // Copyright year
      document.querySelectorAll('[data-config="copyrightYear"]').forEach(el => {
        el.textContent = SITE_CONFIG.copyrightYear;
      });

      // Mobile menu
      const burgerBtn = document.getElementById('burger-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      const closeMenuBtn = document.getElementById('close-menu');
      if (burgerBtn && mobileMenu && closeMenuBtn) {
        burgerBtn.addEventListener('click', () => mobileMenu.classList.remove('hidden'));
        closeMenuBtn.addEventListener('click', () => mobileMenu.classList.add('hidden'));
      }
      window.closeMobileMenu = () => mobileMenu && mobileMenu.classList.add('hidden');
    });
  </script>
</body>
</html>
