name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Hostinger deploy webhook
        run: |
          payload=$(jq -nc \
            --arg ref "refs/heads/${GITHUB_REF_NAME}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            '{ref:$ref, after:$sha, repository:{full_name:$repo, clone_url:("https://github.com/" + $repo + ".git"), default_branch:"main"}}')
          curl -fsSL --max-time 30 --retry 3 --retry-delay 5 \
            -X POST "$HOSTINGER_DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: $(uuidgen)" \
            -d "$payload" \
            -w "\nHTTP %{http_code}\n"
        env:
          HOSTINGER_DEPLOY_URL: ${{ secrets.HOSTINGER_DEPLOY_URL }}
