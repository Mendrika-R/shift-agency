name = "shift-chatbot"
main = "index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "shift-knowledge"

# Secrets à configurer avec : wrangler secret put NOM_SECRET
# OPENROUTER_API_KEY
# N8N_LEAD_WEBHOOK
# INGEST_SECRET
# ALLOWED_ORIGIN

# --- Environnement preprod ---
# Déploiement : wrangler deploy --env preprod
# Secrets     : wrangler secret put NOM_SECRET --env preprod
[env.preprod]
name = "shift-chatbot-preprod"
workers_dev = true

[env.preprod.ai]
binding = "AI"

[[env.preprod.vectorize]]
binding = "VECTORIZE"
index_name = "shift-knowledge-preprod"
